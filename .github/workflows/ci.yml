name: 跨平台持续集成

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-check:
    name: 脚本检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 检查 Shell 语法
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.sh toolchain/*.sh install.sh assets/loaders/install-linux.sh; do
            bash -n "$file"
          done
          for file in tests/*.sh; do
            sh -n "$file"
          done

  build:
    name: 构建
    needs: script-check
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出源码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 安装宿主依赖
        run: sudo apt-get update && sudo apt-get install -y bzip2 patch unzip zip
      - name: 设置可复现时间戳
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: 缓存定制 Cosmopolitan 工具链
        id: toolchain-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: toolchain/cosmo
          key: cosmo-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/*.sh', 'patches/cosmo/**/*') }}
      - name: 从锁定源码构建定制工具链
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: bash
        run: toolchain/provision.sh build all
      - name: 验证工具链入口
        shell: bash
        run: |
          test -x toolchain/cosmo/bin/x86_64-unknown-cosmo-cc
          test -x toolchain/cosmo/bin/aarch64-unknown-cosmo-cc
          test -x toolchain/cosmo/bin/apelink
      - name: 构建双架构 BusyBox
        run: make build
      - name: 生成发布目录
        run: scripts/package-release.sh
      - name: 校验 APE 的 64K 页布局
        shell: bash
        run: |
          scripts/check-ape-64k.sh dist/release/release/busybox-arm64.ape
          scripts/check-ape-64k.sh dist/release/release/busybox-fat.ape
      - name: 上传同一份待测发布物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: busybox-release
          path: dist/release/release
          if-no-files-found: error
          retention-days: 7
      - name: 生成最小发布包 (--min)
        run: scripts/package-release.sh --min
      - name: 校验 min 包 (64K + Linux x86 loader 端到端)
        shell: bash
        run: |
          set -euo pipefail
          scripts/check-ape-64k.sh dist/min/busybox.com
          rm -rf /tmp/minchk && mkdir -p /tmp/minchk && cd /tmp/minchk
          unzip -q /Users/runner/work/busybox-cosmo/busybox-cosmo/dist/busybox-min.zip
          # Linux x86 无 binfmt/assimilate 场景: bb.sh loader 形态 + 自备 ~/.ape-1.10
          export HOME=/tmp/minchk
          cp -f ape-loader-x86_64 "$HOME/.ape-1.10" && chmod +x "$HOME/.ape-1.10"
          BUSYBOX_COSMO_CACHE=/tmp/minchk-cache ./busybox uname -m | grep -q x86_64
          echo "min top-level OK"
          BUSYBOX_COSMO_CACHE=/tmp/minchk-cache ./busybox sh -c 'echo x | grep -qE x && echo MIN-NESTED-OK'
          echo "min nested exec OK"
      - name: 上传 min 包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: busybox-min
          path: dist/busybox-min.zip
          if-no-files-found: error
          retention-days: 7

  unix-matrix:
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            arch: x86_64
            experimental: false
          - name: macOS x86_64
            runner: macos-15-intel
            arch: x86_64
            experimental: false
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            arch: aarch64
            experimental: false
          - name: macOS ARM64（实验）
            runner: macos-15
            arch: arm64
            experimental: true
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: 下载发布物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: busybox-release
          path: release
      - name: 恢复可执行权限
        shell: bash
        run: chmod +x release/busybox release/busybox*.ape release/busybox.com release/assimilate release/ape-loader-*
      - name: 校验运行架构
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: 运行深度与完整测试
        shell: bash
        working-directory: release
        env:
          BUSYBOX_COSMO_CACHE: ${{ runner.temp }}/busybox-cosmo-cache
        run: |
          set +e
          ./busybox sh deep-test.sh
          deep_rc=$?
          ./busybox sh smoke-full.sh
          full_rc=$?
          test "$deep_rc" -eq 0 -a "$full_rc" -eq 0

  windows-matrix:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner: windows-2022
            arch: AMD64
            experimental: false
          - name: Windows ARM64（x86_64 仿真，实验）
            runner: windows-11-arm
            arch: ARM64
            experimental: true
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    steps:
      - name: 下载发布物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: busybox-release
          path: release
      - name: 校验运行架构
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne '${{ matrix.arch }}') {
            throw "意外架构: $env:PROCESSOR_ARCHITECTURE"
          }
      - name: 运行深度与完整测试
        shell: cmd
        working-directory: release
        run: |
          busybox.com sh deep-test.sh
          set DEEP_RC=%ERRORLEVEL%
          busybox.com sh smoke-full.sh
          set FULL_RC=%ERRORLEVEL%
          if not "%DEEP_RC%"=="0" exit /b %DEEP_RC%
          if not "%FULL_RC%"=="0" exit /b %FULL_RC%
